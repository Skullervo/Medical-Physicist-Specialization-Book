{% extends "sisalto/base_summereditor.html" %}

{% block title %}Offline - Sairaalafyysikon erikoistumiskirja{% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px; max-width: 560px; margin: 0 auto;">
    <div style="font-size: 4em; color: var(--text-tertiary); margin-bottom: 24px;">
        <i class="fas fa-wifi" style="opacity: 0.3;"></i>
    </div>
    <h1 style="font-family: var(--font-display); font-size: 1.8em; color: var(--text-primary); margin-bottom: 12px;">
        Olet offline-tilassa
    </h1>
    <p style="color: var(--text-secondary); font-size: 1.05em; line-height: 1.6; margin-bottom: 32px;">
        Yhteyttä palvelimeen ei saada. Tarkista verkkoyhteys ja yritä uudelleen.
    </p>
    <button onclick="window.location.reload()"
            style="background: var(--color-primary); color: var(--text-inverse); border: none; padding: 12px 32px; border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: 600; font-family: var(--font-body);">
        <i class="fas fa-refresh" style="margin-right: 8px;"></i>Yritä uudelleen
    </button>
</div>
{% endblock %}
